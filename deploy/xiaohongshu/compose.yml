services:
  xiaohongshu-mcp:
    image: xpzouying/xiaohongshu-mcp
    container_name: ye-kitty-xiaohongshu-mcp
    restart: unless-stopped
    init: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      - ROD_BROWSER_BIN=/usr/local/bin/cloak-chromium
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CACHE_HOME=/app/data/cache
      - XDG_CONFIG_HOME=/app/data/config
      - XHS_PROXY=${XHS_PROXY:-}
    ports:
      - '${YE_KITTY_XIAOHONGSHU_MCP_PORT:-18060}:18060'
